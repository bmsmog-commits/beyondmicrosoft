    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gabriel Owolabi",
        "jobTitle": "Creative Technologist",
        "brand": {
          "@type": "Brand",
          "name": "Beyond Microsoft (BMS)",
          "slogan": "Elevating Standards. Enhancing Quality."
        },
        "description": "Creative Technologist and founder of Beyond Microsoft, combining creativity, engineering thinking, and technology to build brands, digital experiences, software solutions, and automation systems."
      }
    </script>
  </head>
  <body>
    <noscript>Enable JavaScript to view the Beyond Microsoft portfolio experience.</noscript>
    <div id="root"></div>
    <!--
      Static mirror of the React contact form (src/App.jsx) so Netlify's
      build-time HTML scan can detect and provision the "contact" form.
      The real, visible form is rendered by React and submitted via fetch()
      to this same form name — this element is never shown to visitors.
      Field names must stay in sync with the React form.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <!--
      Static mirror of the React newsletter form (src/App.jsx footer) so
      Netlify's build-time HTML scan can detect and provision the
      "newsletter" form. Field names must stay in sync with the React form.
    -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="newsletter-bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
      <input type="text" name="newsletter-bot-field" />
    </form>
    <!--
      Phase 5: stores BMS AI project inquiries. Submitted only server-side by
      netlify/functions/bms-lead.mjs after validation — never shown to
      visitors. Field names must stay in sync with deliverInquiry() in
      netlify/lib/lead.mjs.
    -->
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="inquiry-bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input type="text" name="submissionId" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="preferredContactMethod" />
      <input type="text" name="projectName" />
      <input type="text" name="services" />
      <textarea name="summary"></textarea>
      <textarea name="payload"></textarea>
      <input type="text" name="inquiry-bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
