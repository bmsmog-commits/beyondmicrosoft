<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Owolabi | Beyond Microsoft - Creative Technologist</title>
    <meta
      name="description"
      content="Gabriel Owolabi is a Creative Technologist combining AI automation, software development, web development, copywriting and brand design to build intelligent digital solutions."
    />
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:title" content="Gabriel Owolabi | Beyond Microsoft - Creative Technologist" />
    <meta
      property="og:description"
      content="Creativity meets technology. Ideas become intelligent solutions with Gabriel Owolabi and Beyond Microsoft."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="/assets/profile/header-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gabriel Owolabi | Beyond Microsoft" />
    <meta
      name="twitter:description"
      content="Creative technology, AI automation, web development, software, brand design and copywriting."
    />
    <meta name="theme-color" content="#0a2d5c" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gabriel Owolabi",
        "jobTitle": "Creative Technologist",
        "brand": {
          "@type": "Brand",
          "name": "Beyond Microsoft (BMS)"
        },
        "description": "Creative Technologist combining AI automation, software development, web development, copywriting and brand design to build intelligent digital solutions."
      }
    </script>
  </head>
  <body>
    <noscript>Enable JavaScript to view the Beyond Microsoft portfolio experience.</noscript>
    <div id="root"></div>
    <!--
      Static mirror of the React contact form (src/App.jsx) so Netlify's
      build-time HTML scan can detect and provision the "contact" form.
      The real, visible form is rendered by React and submitted via fetch()
      to this same form name — this element is never shown to visitors.
      Field names must stay in sync with the React form.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
