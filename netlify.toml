[build]
  command = "npm run build"
  publish = "build"

# BMS AI serverless endpoint (/.netlify/functions/bms-ai). Secrets such as
# AI_API_KEY are set in the Netlify UI, never in this file.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` runs Vite and the functions together on http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
